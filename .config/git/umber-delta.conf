# Generated by ~/.config/umber/delta.py — do not edit.
# The ANSI-named delta settings live in common.conf; only the values that
# differ between variants are here. Selected by DELTA_FEATURES, which
# ~/.config/git/umber-delta sets from the macOS appearance.

[delta "umber-dark"]
    dark = true
    syntax-theme = "Umber"
    minus-style = syntax "#321f1b"
    plus-style = syntax "#202a1d"
    minus-empty-line-marker-style = normal "#321f1b"
    plus-empty-line-marker-style = normal "#202a1d"
    blame-palette = "#271f19 #2f2620 #392f28"

[delta "umber-light"]
    light = true
    syntax-theme = "Umber Light"
    minus-style = syntax "#fae0d9"
    plus-style = syntax "#dae8d6"
    minus-empty-line-marker-style = normal "#fae0d9"
    plus-empty-line-marker-style = normal "#dae8d6"
    blame-palette = "#f2e9df #eae0d6 #e0d5ca"
