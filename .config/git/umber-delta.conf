# Generated by ~/.config/umber/delta.py — do not edit.
# The ANSI-named delta settings live in common.conf; only the values that
# differ between variants are here. Selected by DELTA_FEATURES, which
# ~/.config/git/umber-delta sets from the macOS appearance.

[delta "umber-dark"]
    dark = true
    syntax-theme = "Umber"
    minus-style = syntax "#36231f"
    plus-style = syntax "#262d1f"
    minus-empty-line-marker-style = normal "#36231f"
    plus-empty-line-marker-style = normal "#262d1f"
    blame-palette = "#1e262d #252d34 #2e363f"

[delta "umber-light"]
    light = true
    syntax-theme = "Umber Light"
    minus-style = syntax "#f7ddd7"
    plus-style = syntax "#dbe5d2"
    minus-empty-line-marker-style = normal "#f7ddd7"
    plus-empty-line-marker-style = normal "#dbe5d2"
    blame-palette = "#f1e6dd #e8ddd5 #ded2c8"
