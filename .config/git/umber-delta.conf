# Generated by ~/.config/umber/delta.py — do not edit.
# The ANSI-named delta settings live in common.conf; only the values that
# differ between variants are here. Selected by DELTA_FEATURES, which
# ~/.config/git/umber-delta sets from the macOS appearance.

[delta "umber-dark"]
    dark = true
    syntax-theme = "Umber"
    minus-style = syntax "#36231f"
    plus-style = syntax "#1e3020"
    minus-empty-line-marker-style = normal "#36231f"
    plus-empty-line-marker-style = normal "#1e3020"
    blame-palette = "#1e252d #252d34 #2e363f"

[delta "umber-light"]
    light = true
    syntax-theme = "Umber Light"
    minus-style = syntax "#fee1da"
    plus-style = syntax "#e0edd4"
    minus-empty-line-marker-style = normal "#fee1da"
    plus-empty-line-marker-style = normal "#e0edd4"
    blame-palette = "#f0e6dc #e8ded4 #ddd2c8"
