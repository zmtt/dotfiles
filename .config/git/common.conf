# --- Core ---
[core]
    editor = nvim
    autocrlf = input
    whitespace = trailing-space,space-before-tab
    pager = delta

[init]
    defaultBranch = main

# --- Identity ---
# No name/email here on purpose: those live in personal.conf / work.conf,
# gated by directory. useConfigOnly makes git refuse to commit (rather than
# auto-guess a bogus user@host identity) in any repo outside those trees.
[user]
    useConfigOnly = true

# --- Fetch / Pull / Push ---
[fetch]
    prune = true

[pull]
    rebase = true

[push]
    autoSetupRemote = true

# --- Rebase / Merge / Conflicts ---
[rebase]
    autoStash = true
    updateRefs = true
    autoSquash = true

[merge]
    conflictStyle = zdiff3

[rerere]
    enabled = true

# --- Commit / Status ---
[commit]
    verbose = true

[status]
    showStash = true

# --- Diff / Display ---
[diff]
    algorithm = histogram
    colorMoved = zebra

[interactive]
    diffFilter = delta --color-only

[delta]
    navigate = true # use n and N to move between diff sections
    dark = true # or light = true, or omit for auto-detection

# --- Branch / Tag / Listing output ---
[branch]
    sort = -committerdate

[tag]
    sort = version:refname

[column]
    ui = auto
