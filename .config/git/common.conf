# --- Core ---
[core]
    editor = nvim
    autocrlf = input
    whitespace = trailing-space,space-before-tab
    pager = ~/.config/git/umber-delta

[init]
    defaultBranch = main

# --- Identity ---
# No name/email here on purpose: those live in personal.conf / work.conf,
# gated by directory. useConfigOnly makes git refuse to commit (rather than
# auto-guess a bogus user@host identity) in any repo outside those trees.
[user]
    useConfigOnly = true

# --- Fetch / Pull / Push ---
[fetch]
    prune = true

[pull]
    rebase = true

[push]
    autoSetupRemote = true

# --- Rebase / Merge / Conflicts ---
[rebase]
    autoStash = true
    updateRefs = true
    autoSquash = true

[merge]
    conflictStyle = zdiff3

[rerere]
    enabled = true

# --- Commit / Status ---
[commit]
    verbose = true

[status]
    showStash = true

# --- Diff / Display ---
[diff]
    algorithm = histogram
    colorMoved = zebra

[interactive]
    diffFilter = ~/.config/git/umber-delta --color-only

[delta]
    navigate = true # use n and N to move between diff sections
    line-numbers = true
    hyperlinks = true

    # Umber, in two halves. Everything in this section is named in ANSI slots,
    # so the loaded Ghostty palette supplies the values and no per-variant copy
    # is needed. These replace delta's own defaults, which owed nothing to the
    # palette: context line numbers at #444444, the changed-line markers at
    # 256-cube 88 and 28, and whitespace errors on magenta — the most recessive
    # hue Umber has (USAGE 0.62), for the one signal whose glyph is invisible.
    #
    # Changed words use reverse video rather than a tinted ground, the same
    # highlight ~/.config/fish/conf.d/umber-theme.fish uses: at word scale a
    # full-chroma block is a cue, where at line scale it would be a wall.
    #
    # line-numbers is not cosmetic. The washes sit at chroma 0.030, where a
    # red/green pair cannot reach the dichromat floor: deuteranopic separation
    # measures 0.008 dark and 0.011 light against a floor of 0.035. The gutter
    # numbers below are the channel that does clear it, at 0.046/0.045, so they
    # carry the signal for a dichromat rather than decorating it.
    #
    # The other half — the +/- washes, the syntax theme, the blame ramp — is
    # concrete hex that differs per variant, so umber/delta.py generates it into
    # umber-delta.conf and ~/.config/git/umber-delta picks the block per
    # invocation. Nothing emitted there may also be set here: delta resolves
    # this section *over* an active feature, so a key in both places silently
    # pins the feature's value out. delta.py now fails the build on both traps
    # rather than leaving them to this comment.
    #
    # Forcing a variant by hand takes the whole feature name:
    # DELTA_FEATURES="umber-dark side-by-side". Delta's additive "+side-by-side"
    # form adds to the features named in git config, where the variant is not
    # one, so the + form silently drops the theme.
    minus-emph-style = red reverse
    plus-emph-style = green reverse
    line-numbers-left-style = brightblack
    line-numbers-right-style = brightblack
    line-numbers-zero-style = brightblack
    line-numbers-minus-style = red
    line-numbers-plus-style = green
    whitespace-error-style = red reverse

    # Stock is three lines of blue box around every hunk number, which outshouts
    # the diff it labels on a palette whose grounds sit at chroma 0.028. The
    # file-level rule stays: it is the landmark `navigate` jumps between.
    hunk-header-decoration-style = omit

# Generated by umber/delta.py: the per-variant washes, syntax theme and blame
# ramp. Kept in its own file so a rebuild never rewrites hand-written config.
[include]
    path = ~/.config/git/umber-delta.conf

# --- Branch / Tag / Listing output ---
[branch]
    sort = -committerdate

[tag]
    sort = version:refname

[column]
    ui = auto
